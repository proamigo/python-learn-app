name: Build APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            build-essential libssl-dev libffi-dev \
            libsqlite3-dev libbz2-dev libreadline-dev \
            zlib1g-dev libncurses5-dev libgdbm-dev \
            libnss3-dev liblzma-dev autoconf automake libtool \
            android-sdk-platform-tools android-sdk-build-tools

      - name: Install buildozer
        run: |
          pip install --upgrade pip setuptools wheel cython
          pip install buildozer==1.5.0

      - name: Cache Gradle & Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle
            ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-learn-app-apk
          path: bin/*.apk
          retention-days: 7
